@if (!dismissed()) {
  <div class="prototype-banner" role="note">
    <i class="pi pi-info-circle" aria-hidden="true"></i>
    <p>
      <strong>Design prototype</strong> — static sample data, not the product.
      The real surfaces are the
      <a routerLink="/playground">Playground</a>
      and the
      <a routerLink="/player">Player</a>.
    </p>
    <button type="button" aria-label="Dismiss this notice" (click)="dismiss()">
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>
}
